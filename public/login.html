<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DynamusZap - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header h1 {
      color: #2d3748;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #718096;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 600;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: white;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      border-left: 4px solid #dc2626;
      display: none;
    }

    .success-message {
      background: #d1fae5;
      color: #059669;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      border-left: 4px solid #059669;
      display: none;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
    }

    .remember-me label {
      color: #4a5568;
      font-size: 14px;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .footer p {
      color: #718096;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🚀 DynamusZap</h1>
      <p>Faça login para acessar o sistema</p>
    </div>

    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Usuário</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Senha</label>
        <input type="password" id="password" name="password" class="form-input" required
          autocomplete="current-password">
      </div>

      <div class="remember-me">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Lembrar-me</label>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">
        <span id="login-text">Entrar</span>
        <div class="loading-spinner" id="loading-spinner"></div>
      </button>
    </form>

    <div class="footer">
      <p>&copy; 2025 DynamusZap. Todos os direitos reservados.</p>
    </div>
  </div>

  <script>
    class LoginManager {
      constructor() {
        this.initializeElements();
        this.initializeEventListeners();
        this.checkExistingAuth();
      }

      initializeElements() {
        this.elements = {
          form: document.getElementById('login-form'),
          username: document.getElementById('username'),
          password: document.getElementById('password'),
          remember: document.getElementById('remember'),
          loginBtn: document.getElementById('login-btn'),
          loginText: document.getElementById('login-text'),
          loadingSpinner: document.getElementById('loading-spinner'),
          errorMessage: document.getElementById('error-message'),
          successMessage: document.getElementById('success-message')
        };
      }

      initializeEventListeners() {
        this.elements.form.addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleLogin();
        });

        // Enter key handling
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !this.elements.loginBtn.disabled) {
            this.handleLogin();
          }
        });
      }

      checkExistingAuth() {
        const token = localStorage.getItem('dynamuszap_token') || sessionStorage.getItem('dynamuszap_token');
        if (token) {
          this.verifyToken(token).then(valid => {
            if (valid) {
              this.redirectToApp();
            }
          });
        }
      }

      async verifyToken(token) {
        try {
          const response = await fetch('/api/whatsapp/health', {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          return response.ok;
        } catch (error) {
          return false;
        }
      }

      async handleLogin() {
        const username = this.elements.username.value.trim();
        const password = this.elements.password.value.trim();
        const remember = this.elements.remember.checked;

        if (!username || !password) {
          this.showError('Por favor, preencha todos os campos');
          return;
        }

        this.setLoading(true);
        this.hideMessages();

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const result = await response.json();

          if (response.ok) {
            this.handleLoginSuccess(result.data, remember);
          } else {
            this.handleLoginError(result.message || 'Erro ao fazer login');
          }
        } catch (error) {
          console.error('Erro no login:', error);
          this.handleLoginError('Erro de conexão. Tente novamente.');
        } finally {
          this.setLoading(false);
        }
      }

      handleLoginSuccess(data, remember) {
        const { accessToken, refreshToken } = data;

        // Armazenar tokens
        if (remember) {
          localStorage.setItem('dynamuszap_token', accessToken);
          localStorage.setItem('dynamuszap_refresh_token', refreshToken);
        } else {
          sessionStorage.setItem('dynamuszap_token', accessToken);
          sessionStorage.setItem('dynamuszap_refresh_token', refreshToken);
        }

        this.showSuccess('Login realizado com sucesso! Redirecionando...');

        setTimeout(() => {
          this.redirectToApp();
        }, 1000);
      }

      handleLoginError(message) {
        this.showError(message);
        this.elements.password.value = '';
        this.elements.password.focus();
      }

      redirectToApp() {
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('returnUrl') || '/';

        // Verificar se é uma URL local válida
        try {
          if (returnUrl.startsWith('/') || returnUrl.startsWith(window.location.origin)) {
            window.location.href = returnUrl;
          } else {
            window.location.href = '/';
          }
        } catch (e) {
          window.location.href = '/';
        }
      }

      setLoading(loading) {
        this.elements.loginBtn.disabled = loading;
        this.elements.loginText.style.display = loading ? 'none' : 'inline';
        this.elements.loadingSpinner.style.display = loading ? 'block' : 'none';
      }

      showError(message) {
        this.elements.errorMessage.textContent = message;
        this.elements.errorMessage.style.display = 'block';
        this.elements.successMessage.style.display = 'none';
      }

      showSuccess(message) {
        this.elements.successMessage.textContent = message;
        this.elements.successMessage.style.display = 'block';
        this.elements.errorMessage.style.display = 'none';
      }

      hideMessages() {
        this.elements.errorMessage.style.display = 'none';
        this.elements.successMessage.style.display = 'none';
      }
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new LoginManager();
    });
  </script>
</body>

</html>
